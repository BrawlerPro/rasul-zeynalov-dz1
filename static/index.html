<!doctype html><html lang="ru"><meta charset="utf-8"><title>rasul_zeynalov — служба поддержки</title>
<style>body{font:16px system-ui;background:#eef2f6;color:#182a3e;margin:0}header{background:#182a3e;color:white;padding:20px 32px}main{max-width:1080px;margin:24px auto;padding:0 24px}section{background:white;border:1px solid #d6dfe8;padding:22px;margin:16px 0;border-radius:8px}h1{font-size:22px;margin:0}h2{font-size:21px}small{color:#b7c9dc}input,select,textarea,button{font:inherit;padding:9px;margin:4px;border:1px solid #becbd8;border-radius:4px}button{background:#e9f0f7;cursor:pointer}button.primary{background:#245f95;color:white}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #dce3ea;text-align:left;padding:12px}th{background:#f3f6f9}a{color:#245f95;cursor:pointer;text-decoration:underline}.metrics{display:flex;gap:24px;font-size:20px}.muted{color:#63778b}#error{color:#a52121;white-space:pre-wrap}textarea{display:block;width:90%}.badge{font-size:14px;background:#e6eef5;padding:5px 10px}.actions{display:flex;justify-content:space-between;align-items:center}</style>
<header><h1>Служба поддержки · rasul_zeynalov</h1><small>ДЗ 1 · вариант 2 · PostgreSQL · исходная версия</small></header>
<main><div id="error"></div><section id="login"><h2>Вход в сервис</h2><input id="username" value="rasul" aria-label="Логин"><input id="password" type="password" placeholder="Пароль из SEED_PASSWORD" aria-label="Пароль"><button class="primary" onclick="login()">Войти</button><p class="muted">Учебная учётная запись сотрудника. Данные развёрнуты в схеме rasul_zeynalov.</p></section>
<div id="workspace" hidden><nav><button onclick="list(1)">Список заявок</button><button onclick="summary()">Сводка по категориям</button><button onclick="createForm()">Новая заявка</button><span id="identity"></span></nav><section id="screen"></section></div></main>
<script>
const screen=document.getElementById('screen'),error=document.getElementById('error');let categories=[],currentPage=1,filter='';
const names={new:'Новая',in_progress:'В работе',closed:'Закрыта'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,method='GET',body){error.textContent='';const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const x=await r.json();if(!r.ok){error.textContent=r.status+' · '+JSON.stringify(x.detail);throw Error(error.textContent)}return x}
async function login(){const x=await api('login','POST',{login:document.getElementById('username').value,password:document.getElementById('password').value});document.getElementById('login').hidden=true;document.getElementById('workspace').hidden=false;document.getElementById('identity').textContent=x.user.name+' · '+x.user.role;categories=(await api('categories')).items;await list(1)}
async function list(page){currentPage=page;const x=await api(`tickets?page=${page}&size=10${filter?'&status='+filter:''}`);screen.innerHTML=`<div class="actions"><h2>Заявки в службу поддержки</h2><span class="badge">Всего по фильтру: ${x.total}</span></div><label>Статус <select onchange="filter=this.value;list(1)"><option value="">Все</option>${Object.entries(names).map(([k,v])=>`<option value="${k}" ${filter===k?'selected':''}>${v}</option>`).join('')}</select></label><table><tr><th>№</th><th>Заявка</th><th>Категория</th><th>Автор</th><th>Статус</th></tr>${x.items.map(t=>`<tr><td>${t.id}</td><td><a onclick="detail(${t.id})">${esc(t.title)}</a></td><td>${esc(t.category)}</td><td>${esc(t.author)}</td><td>${names[t.status]}</td></tr>`).join('')}</table><p><button ${page===1?'disabled':''} onclick="list(${page-1})">Назад</button>Страница ${page}<button ${page*10>=x.total?'disabled':''} onclick="list(${page+1})">Вперёд</button></p>`}
async function detail(id){const x=await api('tickets/'+id),t=x.ticket;screen.innerHTML=`<h2>${esc(t.title)} <span class="badge">${names[t.status]}</span></h2><p>${esc(t.body)}</p><p>Автор: ${esc(t.author)} · Категория: ${esc(t.category)} · Создана: ${new Date(t.created_at).toLocaleString('ru-RU')}</p><p>Норматив: ${t.sla_hours} ч · ${x.awaiting_response?'Ожидание ответа':'Срок реакции'}: ${x.reaction_hours.toFixed(2)} ч · ${x.sla_breached?'Норматив нарушен':'В пределах норматива'}</p><p>${t.status==='new'?`<button onclick="status(${id},'in_progress')">Взять в работу</button>`:t.status==='in_progress'?`<button onclick="status(${id},'closed')">Закрыть</button>`:`<button onclick="status(${id},'in_progress')">Возобновить</button>`}</p><h3>Переписка</h3>${x.comments.map(c=>`<p><b>${esc(c.author)} (${c.role})</b> · ${new Date(c.created_at).toLocaleString('ru-RU')}<br>${esc(c.body)}</p>`).join('')}${t.status!=='closed'?`<textarea id="message" placeholder="Текст комментария"></textarea><button class="primary" onclick="sendComment(${id})">Отправить комментарий</button>`:''}`}
async function status(id,status){await api(`tickets/${id}/status`,'PATCH',{status});await detail(id)}
async function sendComment(id){await api(`tickets/${id}/comments`,'POST',{body:document.getElementById('message').value});await detail(id)}
function createForm(){screen.innerHTML=`<h2>Создать заявку</h2><input id="title" placeholder="Заголовок"><select id="category">${categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><textarea id="body" placeholder="Описание проблемы"></textarea><button class="primary" onclick="create()">Создать</button>`}
async function create(){const t=await api('tickets','POST',{title:document.getElementById('title').value,body:document.getElementById('body').value,category_id:Number(document.getElementById('category').value)});await detail(t.id)}
async function summary(){screen.innerHTML='<p>Вычисление по всем данным…</p>';const x=await api('summary');screen.innerHTML=`<h2>Сводка по категориям</h2><div class="metrics"><p>Всего заявок: <b>${x.total}</b></p><p>Открытых: <b>${x.open}</b></p></div><table><tr><th>Категория</th><th>Норматив, ч</th><th>Открытых</th><th>С нарушением</th><th>Доля нарушений</th></tr>${x.categories.map(c=>`<tr><td>${esc(c.category)}</td><td>${c.sla_hours}</td><td>${c.open}</td><td>${c.breached}</td><td>${(100*c.breached_share).toFixed(1)}%</td></tr>`).join('')}</table><p class="muted">Сводка рассчитана по всем заявкам. Нарушение — первый ответ сотрудника позже норматива; при отсутствии ответа учитывается текущее время. На ${new Date(x.as_of).toLocaleString('ru-RU')}.</p>`}
</script></html>
